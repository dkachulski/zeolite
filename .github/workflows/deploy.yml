# Builds the site from this branch (the Astro source) and commits the output
# to main, which GitHub Pages serves as plain files (trassing.com). Main
# holds only the build; never edit it by hand, push to this branch instead.
name: Build and deploy to main

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit the build to main
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach ../site FETCH_HEAD
          cd ../site
          git rm -rq --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/dist/." .
          cat > README.md <<README
          # trassing.com (built site)

          This branch is generated: GitHub Pages serves it as the site. The
          source is on the [\`source\`](https://github.com/dkachulski/zeolite/tree/source) branch; every push
          there rebuilds the site and commits it here. Do not edit this branch.

          Built from source@${SOURCE_SHA::7}.
          README
          git add -A
          if git diff --cached --quiet; then
            echo "The build is unchanged; nothing to deploy."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy source@${SOURCE_SHA::7}"
          # The token is given here, not through checkout's stored
          # credentials, which a worktree may not see.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
